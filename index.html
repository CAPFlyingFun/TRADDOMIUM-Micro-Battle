<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <!-- Added to the home screen, this runs with no browser chrome, which
         is the only way to get a whole landscape HUD on an iPhone. iOS
         reads its own apple- prefixed tags, so both sets are here. The
         manifest, icons and splash arrive in a later phase. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TRADDOMIUM" />
    <meta name="theme-color" content="#0b0f07" />
    <title>TRADDOMIUM: Micro Battle!</title>
    <!-- Inline so there is no favicon request to 404: the boot probe counts
         console errors, and a missing icon would fail it for nothing. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%90%9C%3C/text%3E%3C/svg%3E"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #06090c;
        color: #e8e2c8;
        font-family: system-ui, sans-serif;
        /* A game, not a page: no scrolling, no pinch zoom, no text
           selection or long-press callout on held controls. */
        touch-action: none;
        overscroll-behavior: none;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      /* Not `inset: 0`: a mobile browser toolbar can overlay the layout
         viewport instead of shrinking it, so height follows the dynamic
         viewport unit rather than the layout box. */
      #app,
      #ui {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 100dvh;
      }
      #app canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      /* The overlay layer sits above the canvas and passes touches
         through except where a screen puts something to touch. */
      #ui {
        z-index: 10;
        pointer-events: none;
      }
      #ui > * {
        pointer-events: auto;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="ui"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
