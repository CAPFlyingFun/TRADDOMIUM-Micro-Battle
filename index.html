<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <!-- Added to the home screen, this runs with no browser chrome, which
         is the only way to get a whole landscape HUD on an iPhone. iOS
         reads its own apple- prefixed tags rather than the manifest, so
         both sets are here. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- The home-screen label. It is the GAME'S name, not an initialism:
         "TMB v1" told nobody what they had installed, and ten characters
         is what an iOS label shows before it truncates. Which build this
         is belongs where there is room to say it — the manifest's full
         name, the About screen and the build stamp — not in the two words
         under the icon. -->
    <meta name="apple-mobile-web-app-title" content="TRADDOMIUM" />
    <meta name="theme-color" content="#0b0f07" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <!-- The splash is the first paint, so it is asked for first — and
         only the one this screen will actually show. -->
    <link rel="preload" as="image" href="./splash.webp" type="image/webp" media="(orientation: landscape)" />
    <link rel="preload" as="image" href="./splash-portrait.webp" type="image/webp" media="(orientation: portrait)" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>TRADDOMIUM: Micro Battle!</title>
    <!-- Inline so there is no favicon request to 404: the boot probe counts
         console errors, and a missing icon would fail it for nothing. -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' font-size='26'%3E%F0%9F%90%9C%3C/text%3E%3C/svg%3E"
    />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #06090c;
        color: #e8e2c8;
        font-family: system-ui, sans-serif;
        /* A game, not a page: no scrolling, no pinch zoom, no text
           selection or long-press callout on held controls. */
        touch-action: none;
        overscroll-behavior: none;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      /* Not `inset: 0`: a mobile browser toolbar can overlay the layout
         viewport instead of shrinking it, so height follows the dynamic
         viewport unit rather than the layout box. */
      #app,
      #ui {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 100dvh;
      }
      #app canvas {
        display: block;
        width: 100%;
        height: 100%;
      }
      /* The overlay layer sits above the canvas and passes touches
         through except where a screen puts something to touch. */
      #ui {
        z-index: 10;
        pointer-events: none;
      }
      #ui > * {
        pointer-events: auto;
      }

      /* ---------- The way in ----------
         IN THE STATIC MARKUP ON PURPOSE. "As soon as you open the game"
         means before the module is parsed and before three is loaded.
         Anything built in JavaScript arrives after all of that, which on
         a phone is a second or more of nothing. This paints with the
         document.

         The picture has the loading bar's interior CUT OUT of it, so it
         is the front layer of a sandwich: src/ui/splash/BootSplash.ts
         slides the fill in behind it once the module is alive. The
         window's rectangle is generated from the art's alpha channel,
         and generated numbers do not belong in hand-written markup.

         Above #ui, so the menu's fade-in happens behind it; main.ts
         dismisses it once the menu is up, and it is removed rather than
         left invisible because a fixed full-screen element eats taps. */
      #boot {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: 100dvh;
        overflow: hidden;
        background: #080c06;
        z-index: 80;
        opacity: 1;
        transition: opacity 700ms ease;
      }
      #boot.gone {
        opacity: 0;
        pointer-events: none;
      }
      /* ─── LANDSCAPE ONLY ─────────────────────────────────────────────
         This game is a THUMBSTICK game. Movement is a stick under the
         left thumb and the camera is the right one; it is not a
         tap-to-move that would survive a tall screen. Held upright the
         controls have nowhere to sit and the 3D camera — which keeps a
         fixed VERTICAL field of view, so a narrow viewport shows LESS of
         the room, not more — frames a wall. So portrait is refused
         rather than laid out.

         A PROMPT AND NOT AN API, because there is no API. iOS Safari
         does not implement Screen Orientation Lock at all, and
         everywhere else `lock()` needs fullscreen first. Beyond
         Extinction reached the same conclusion and says so in its own
         markup; this is the same gate in this game's black and gold.

         PURE CSS, IN THE STATIC DOCUMENT. It is not a scene, not a
         component and touches no script, so it covers the splash, the
         menu, the world and every dev tool alike, it is up before the
         first module is parsed, and it cannot get stuck in a bad JS
         state — which a gate that hides the whole game must never do.

         `pointer: coarse` IS LOAD-BEARING: it is what keeps the gate off
         a narrow desktop window, where a tall viewport is a resized
         window and not a phone nobody has turned. `manifest.webmanifest`
         already asks for `"orientation": "landscape"`, which an
         INSTALLED app honours on Android; this is what covers Safari,
         the browser tab, and every phone that ignores it. */
      #orient {
        display: none;
      }
      @media (orientation: portrait) and (pointer: coarse) {
        #orient {
          display: flex;
          position: fixed;
          inset: 0;
          z-index: 200;
          align-items: center;
          justify-content: center;
          text-align: center;
          padding: 24px;
          background: #06090c;
        }
        /* Nothing behind the gate may be touched, scrolled or read out. */
        #app,
        #ui,
        #boot {
          visibility: hidden;
        }
      }
      #orient .phone {
        width: 46px;
        height: 80px;
        margin: 0 auto 26px;
        border: 3px solid #c9a94a;
        border-radius: 9px;
        animation: orient-turn 2.4s ease-in-out infinite;
      }
      @keyframes orient-turn {
        0%, 42% { transform: rotate(0deg); }
        58%, 100% { transform: rotate(-90deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        #orient .phone { animation: none; transform: rotate(-90deg); }
      }
      #orient .title {
        font: 600 19px/1.3 system-ui, sans-serif;
        letter-spacing: 0.04em;
        color: #e8e2c8;
      }
      #orient .hint {
        margin: 10px auto 0;
        max-width: 30ch;
        font: 13px/1.5 system-ui, sans-serif;
        color: #c9a94a;
      }
      /* COVERING the screen, sized and centred from viewport units so the
         picture is right on the FIRST paint — #boot is fixed to the
         viewport, so these describe its box exactly. Landscape by
         default; portrait gets the other artwork's shape below. The
         shapes are the art's nominal 16:9 and 9:16; fitCover re-measures
         with the baked ratio once the module runs, which is also what
         slides the crop up far enough to keep the caption on an extreme
         phone and what notices a turn. Placed with MARGINS, the same
         way fitCover places it, so nothing jumps when the script takes
         over. Behind the cut-out window is this element's own dark
         background: the empty bar. */
      #boot .stage {
        --stage-w: max(100vw, calc(100dvh * 16 / 9));
        --stage-h: max(100dvh, calc(100vw * 9 / 16));
        position: relative;
        width: var(--stage-w);
        height: var(--stage-h);
        margin-left: calc((100vw - var(--stage-w)) / 2);
        margin-top: calc((100dvh - var(--stage-h)) / 2);
        background: rgba(6, 8, 5, 0.92);
        container-type: size;
        line-height: 0;
      }
      @media (orientation: portrait) {
        #boot .stage {
          --stage-w: max(100vw, calc(100dvh * 9 / 16));
          --stage-h: max(100dvh, calc(100vw * 16 / 9));
        }
      }
      #boot .stage picture {
        display: contents;
      }
      #boot .stage img {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        object-fit: fill;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="ui"></div>
    <!-- Dismissed by main.ts once the menu is up. -->
    <div id="boot">
      <div class="stage">
        <!-- The browser picks one before any script runs, and having
             chosen, keeps it up to date as the phone turns. -->
        <picture>
          <source media="(orientation: portrait)" srcset="./splash-portrait.webp" />
          <img src="./splash.webp" alt="TRADDOMIUM: Micro Battle!" />
        </picture>
      </div>
    </div>
    <!-- Landscape-only gate. See #orient in the stylesheet above: it is
         pure CSS in the static document so it covers every screen and
         can never be left up, or down, by a script. -->
    <div id="orient" role="alertdialog" aria-label="Rotate your device">
      <div>
        <div class="phone" aria-hidden="true"></div>
        <div class="title">Turn your phone sideways</div>
        <p class="hint">TRADDOMIUM plays in landscape — the stick needs a thumb on each side.</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
