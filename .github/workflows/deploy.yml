name: Build & Deploy

# Every push to main is gated on typecheck + tests, then published to
# GitHub Pages so the current build is playable on a device.
#
# TWO BUILDS, ONE SITE (Joshua, 2026-09-04). While v1 is rebuilt from the
# foundation outward, the playable v0 game stays at the site root — it is
# what the installed PWA opens — and v1 deploys beside it under /v1/.
# v0 is built from the read-only archive branch legacy/v0-main exactly as
# it is; this workflow edits nothing on that branch.
#
# ONE-TIME SETUP (repo owner, once per repo):
#   Settings → Pages → Build and deployment → Source: "GitHub Actions"
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Probes use Playwright locally; CI only needs the builds.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # v1 — this branch. Gated on typecheck and tests.
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # The relay's own typecheck. It cannot ride on `npm run typecheck`:
      # the root tsconfig targets the browser and the worker one targets
      # workerd, and each fails on the other's sources. Cheap, has no
      # runtime, and without it worker/ would drift uncompiled.
      - run: npm run relay:typecheck

      # v0 — the archive branch, built as-is. Its tests are frozen with
      # it; its build (tsc + vite) is the only gate that matters here.
      - uses: actions/checkout@v4
        with:
          ref: legacy/v0-main
          path: v0
      - run: npm ci
        working-directory: v0
      - run: npm run build
        working-directory: v0

      # v0 at the root, v1 under /v1/. Both builds use a relative Vite
      # base ('./'), so each works from wherever it is served.
      - name: Assemble the site
        run: |
          rm -rf site
          mkdir -p site/v1
          cp -R v0/dist/. site/
          cp -R dist/. site/v1/
          echo "root:" && ls site && echo "v1:" && ls site/v1

      - name: Upload site artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # The relay, proved against the REAL Workers runtime: this job starts
  # workerd locally (wrangler dev --local, no Cloudflare account) and
  # drives two WebSockets through join, move, a refused teleport, a drop
  # and a re-attach. It is deliberately NOT a gate on `deploy`: the relay
  # is a separate deployment, and a wedged workerd must not be able to
  # keep a game build off Joshua's phone. It still fails the run, loudly.
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm run probe:relay

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
