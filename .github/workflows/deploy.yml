name: Build & Deploy

# The hybrid Chapter One is the normal PWA at root and /v1/ (existing installs).
# Current TRADDOMIUM systems remain at /island/; frozen v0 remains at /legacy/.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Probes use Playwright locally; CI only needs the builds.
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # Existing TRADDOMIUM systems, retained intact and gated on tests.
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      # The relay's own typecheck. It cannot ride on `npm run typecheck`:
      # the root tsconfig targets the browser and the worker one targets
      # workerd, and each fails on the other's sources. Cheap, has no
      # runtime, and without it worker/ would drift uncompiled.
      - run: npm run relay:typecheck

      # Hybrid narrative package: reproducible dependency lock, same quality gates.
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
        working-directory: prototype
      - run: npm run typecheck && npm test && npm run verify:assets && npm run verify:rigs && npm run build:pwa
        working-directory: prototype

      # v0 — the archive branch, built as-is. Its tests are frozen with
      # it; its build (tsc + vite) is the only gate that matters here.
      - uses: actions/checkout@v4
        with:
          ref: legacy/v0-main
          path: v0
      - run: npm ci
        working-directory: v0
      - run: npm run build
        working-directory: v0

      # Every mount uses relative assets. Keep both original game builds
      # alongside the hybrid, including original island save keys.
      - name: Assemble the site
        run: |
          rm -rf site
          mkdir -p site/v1 site/island site/legacy
          cp -R v0/dist/. site/legacy/
          cp -R dist/. site/island/
          cp -R prototype/dist/. site/
          cp -R prototype/dist/. site/v1/
          echo "root:" && ls site && echo "v1:" && ls site/v1

      - name: Upload site artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # The relay, proved against the REAL Workers runtime: this job starts
  # workerd locally (wrangler dev --local, no Cloudflare account) and
  # drives two WebSockets through join, move, a refused teleport, a drop
  # and a re-attach. It is deliberately NOT a gate on `deploy`: the relay
  # is a separate deployment, and a wedged workerd must not be able to
  # keep a game build off Joshua's phone. It still fails the run, loudly.
  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm run probe:relay

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
